[package]
name = "bridge-transmitter"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
# The engine, and the bridge crate that flattens a live message into data.
# Only this side needs either of them. The conversion is not written here: it
# lives in rs-teststand-bridge so a host does not have to get it right twice.
rs-teststand = { version = "0.0.4", path = "../../../crates/rs-teststand" }
rs-teststand-bridge = { version = "0.0.4", path = "../../../crates/rs-teststand-bridge" }
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
# Supplies a protoc binary, so this builds on a machine with no protobuf
# compiler installed. A demonstration nobody can compile proves nothing.
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
