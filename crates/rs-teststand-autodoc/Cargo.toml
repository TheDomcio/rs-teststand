[package]
name = "rs-teststand-autodoc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Generate Markdown documentation from National Instruments TestStand™ sequence files"
documentation = "https://docs.rs/rs-teststand-autodoc"
repository.workspace = true
rust-version.workspace = true
keywords = ["teststand", "documentation", "markdown", "test-automation", "ni"]
categories = ["command-line-utilities", "os::windows-apis"]
readme = "README.md"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]
all-features = true

[dependencies]
rs-teststand = { path = "../rs-teststand", version = "0.13.0" }
rs-teststand-serde = { path = "../rs-teststand-serde", version = "0.13.0" }
merman = { version = "0.8.0-alpha.5", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
regex = "1"
markdown = "1.0.0"
slug = "0.1.6"

[features]
default = []
live-engine = ["rs-teststand/live-engine"]

[[bin]]
name = "rs-teststand-autodoc"
path = "src/main.rs"

[lints]
workspace = true
