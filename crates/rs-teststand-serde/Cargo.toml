[package]
name = "rs-teststand-serde"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Serialize a National Instruments TestStand™ PropertyObject tree to and from any serde format"
documentation = "https://docs.rs/rs-teststand-serde"
repository.workspace = true
rust-version.workspace = true
keywords = ["teststand", "serde", "json", "test-automation", "ni"]
categories = ["api-bindings", "encoding", "os::windows-apis"]
readme = "README.md"

# An addition to the binding, not part of it. `rs-teststand` mirrors the COM API
# and carries no serialization framework; a caller that never serializes a
# property tree pays for none of this.
[package.metadata.docs.rs]
# This crate wraps a Windows COM API and does not build for Linux, which is what
# docs.rs targets by default. Point it at Windows so the documentation builds.
default-target = "x86_64-pc-windows-msvc"
# `default-target` is built as well as these, so it is not repeated here.
targets = ["i686-pc-windows-msvc"]
all-features = true

[dependencies]
rs-teststand = { path = "../rs-teststand", version = "0.12.1" }
serde = { version = "1", features = ["derive"] }

[features]
default = []
# Enables tests and examples that instantiate the live TestStand(TM) Engine.
live-engine = ["rs-teststand/live-engine"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
